name: Repository and UART checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check project references, docs and published firmware
        run: python3 scripts/check_repo.py

  uart-simulation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install Icarus Verilog
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y iverilog
      - name: Run physical UART and packet testbench
        run: python3 scripts/run_hdl_sim.py
